<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>عملاء التطبيق | المهندس</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#004A87">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="عملاء المهندس">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/apple-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#004A87; --navy-2:#003A6C; --orange:#ED7423; --cyan:#39C0E0;
  --bg:#EEF2F7; --surface:#FFFFFF; --surface-2:#F6F8FB; --surface-3:#EDF1F6; --ink:#0F2236; --muted:#5A6B7E; --line:#DFE6EE;
  --g:#2E9E5B; --g-bg:#EAF7EF; --y:#D9A300; --y-bg:#FFF7DB; --r:#D23C3C; --r-bg:#FDECEC;
  --chip-pending-bd:#B5C0CC; --focus:#39C0E0; --wa:#1FA855;
  --shadow-sm:0 1px 2px rgba(15,34,54,.06);
  --shadow:0 1px 2px rgba(15,34,54,.05),0 8px 24px -12px rgba(15,34,54,.18);
  --shadow-lg:0 24px 60px -20px rgba(15,34,54,.45);
  --radius:16px; --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
  --font:"Readex Pro","Segoe UI",Tahoma,Arial,sans-serif;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1522; --surface:#122034; --surface-2:#172840; --surface-3:#1D3150; --ink:#E7EEF6; --muted:#97A8BC; --line:#233752;
    --g:#4CC47F; --g-bg:#12301F; --y:#F2C230; --y-bg:#33290B; --r:#F06A6A; --r-bg:#3A1717;
    --chip-pending-bd:#4A5D74; --navy:#4A8FD1;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0B1522; --surface:#122034; --surface-2:#172840; --surface-3:#1D3150; --ink:#E7EEF6; --muted:#97A8BC; --line:#233752;
  --g:#4CC47F; --g-bg:#12301F; --y:#F2C230; --y-bg:#33290B; --r:#F06A6A; --r-bg:#3A1717;
  --chip-pending-bd:#4A5D74; --navy:#4A8FD1;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
a{color:inherit}

/* ---------- motion ---------- */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
@keyframes slideUp{from{opacity:0;transform:translateY(120%)}to{opacity:1;transform:none}}
@keyframes drip{from{height:0}to{height:var(--drip,40%)}}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(237,116,35,.45)}70%{box-shadow:0 0 0 8px rgba(237,116,35,0)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.view{animation:fadeUp .45s var(--ease) both}
.stagger>*{animation:fadeUp .5s var(--ease) both;animation-delay:calc(var(--i,0) * 35ms)}

/* ---------- buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:9px 15px;border-radius:12px;cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap;transition:transform .15s var(--ease),background .2s,border-color .2s,box-shadow .2s}
.btn:hover{border-color:var(--navy);box-shadow:var(--shadow-sm)}
a.btn{text-decoration:none}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,#0A5799,#004A87);border-color:#004A87;color:#fff;box-shadow:0 6px 16px -8px rgba(0,74,135,.7)}
.btn.primary:hover{background:linear-gradient(180deg,#0B5FA6,#003A6C)}
.btn.accent{background:linear-gradient(180deg,#F58435,#ED7423);border-color:#ED7423;color:#fff;box-shadow:0 6px 16px -8px rgba(237,116,35,.8)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line);background:var(--surface)}
.btn.danger{color:var(--r)}
.btn.small{padding:6px 11px;font-size:13px;border-radius:10px}
.btn.icon{padding:7px;width:34px;height:34px}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn svg{width:17px;height:17px;flex:none}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea,.inp{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font-size:15px;color:var(--ink);width:100%;transition:border-color .2s,box-shadow .2s}
.field textarea{min-height:90px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus,.inp:focus{border-color:var(--cyan);outline:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--cyan) 20%,transparent)}
.err-text{color:var(--r);font-size:13px;min-height:1.2em}
.check{display:flex;gap:9px;align-items:flex-start;font-size:14px;cursor:pointer}
.check input{margin-top:4px;accent-color:#004A87;width:16px;height:16px}
.switch{position:relative;width:42px;height:24px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:background .25s}
.switch span::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:18px;height:18px;background:#fff;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .3s var(--spring)}
.switch input:checked+span{background:#2E9E5B}
.switch input:checked+span::after{transform:translateX(-18px)}
.switch input:focus-visible+span{outline:2px solid var(--focus);outline-offset:2px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.toggle-row:last-child{border-bottom:0}
.toggle-row b{display:block;font-weight:500}
.toggle-row small{color:var(--muted);font-size:13px}

/* ---------- auth ---------- */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(1200px 600px at 100% -10%,color-mix(in srgb,var(--cyan) 22%,transparent),transparent 60%),radial-gradient(900px 500px at -10% 110%,color-mix(in srgb,var(--orange) 18%,transparent),transparent 60%)}
.auth-card{width:100%;max-width:410px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:34px 30px;box-shadow:var(--shadow-lg);animation:pop .6s var(--spring) both}
.auth-logo{display:block;margin:0 auto 22px;width:220px;background:#fff;border-radius:14px;padding:10px}
.auth h1{font-size:21px;margin:0 0 4px;font-weight:600}
.auth p.sub{margin:0 0 20px;color:var(--muted);font-size:14px}
.auth form{display:flex;flex-direction:column;gap:14px}
.auth .btn.primary{padding:12px}
.loading{min-height:100vh;display:grid;place-items:center;color:var(--muted)}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--orange);animation:spin .8s linear infinite;margin:0 auto 12px}

/* ---------- shell ---------- */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--line)}
.top::after{content:"";position:absolute;inset-inline:0;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--cyan),var(--orange) 50%,#004A87);opacity:.85}
.top-in{max-width:1380px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:10px 20px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px}
.brand img{width:42px;height:auto;transition:transform .5s var(--spring)}
.brand:hover img{transform:rotate(-6deg) scale(1.06)}
.brand small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.tabs{position:relative;display:flex;gap:2px;margin-inline-start:14px;background:var(--surface-3);padding:4px;border-radius:14px}
.tab{position:relative;z-index:1;border:0;background:none;padding:8px 14px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:500;display:inline-flex;gap:7px;align-items:center;transition:color .2s}
.tab svg{width:17px;height:17px}
.tab[aria-selected="true"]{color:var(--ink)}
.tab-ind{position:absolute;top:4px;bottom:4px;border-radius:10px;background:var(--surface);box-shadow:var(--shadow-sm);transition:all .4s var(--spring)}
.me{margin-inline-start:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:600;color:#fff;background:linear-gradient(135deg,#004A87,#39C0E0)}
.me b{color:var(--ink);font-weight:500;display:block;font-size:14px}
main{max-width:1380px;margin:0 auto;padding:22px 20px 90px}
.notice{display:flex;gap:10px;align-items:center;background:var(--y-bg);border:1px solid color-mix(in srgb,var(--y) 40%,transparent);padding:10px 14px;border-radius:12px;font-size:14px;margin-bottom:14px;animation:fadeUp .4s var(--ease) both}
.notice .btn{margin-inline-start:auto}
.page-head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:16px}
.page-head h2{margin:0;font-size:22px;font-weight:600}
.page-head p{margin:2px 0 0;color:var(--muted);font-size:14px}
.page-head .actions{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kpi{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow-sm);transition:transform .25s var(--ease),box-shadow .25s}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.kpi b{display:block;font-size:30px;font-weight:600;line-height:1.15}
.kpi span{color:var(--muted);font-size:13px}
.kpi i{position:absolute;inset-inline-end:14px;top:14px;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--k-bg,var(--surface-3));color:var(--k,#004A87)}
.kpi i svg{width:18px;height:18px}
.kpi small{display:block;font-size:12px;color:var(--muted);margin-top:2px}

/* ---------- toolbar ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.search{position:relative;flex:1 1 260px;min-width:200px}
.search svg{position:absolute;inset-inline-start:12px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--muted)}
.search input{padding-inline-start:38px}
.toolbar select{width:auto;min-width:130px}
.menu{position:relative}
.menu-pop{position:absolute;inset-inline-end:0;top:calc(100% + 6px);z-index:20;min-width:190px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);padding:6px;animation:pop .25s var(--ease) both}
.menu-pop button{display:flex;width:100%;gap:9px;align-items:center;border:0;background:none;padding:9px 10px;border-radius:10px;cursor:pointer;text-align:start}
.menu-pop button:hover{background:var(--surface-3)}
.menu-pop svg{width:17px;height:17px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px 6px 12px;cursor:pointer;font-size:14px;transition:all .2s var(--ease)}
.pill:hover{transform:translateY(-1px)}
.pill .dot{width:10px;height:16px;border-radius:0 0 6px 6px}
.pill b{font-weight:600}
.pill[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.pill.warn{border-color:color-mix(in srgb,var(--orange) 60%,transparent);background:color-mix(in srgb,var(--orange) 10%,var(--surface));animation:pulse 2.2s infinite}
.legend .count{color:var(--muted);font-size:13px;margin-inline-start:auto}

/* ---------- client list ---------- */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow-x:auto;overflow-y:hidden;box-shadow:var(--shadow-sm)}
.list-in{min-width:var(--minw,0px)}
.cols{display:grid;grid-template-columns:var(--cols);gap:14px;align-items:center}
.head{padding:11px 18px 11px 14px;padding-inline-start:26px;font-size:12.5px;color:var(--muted);background:var(--surface-2);border-bottom:1px solid var(--line);font-weight:500;position:sticky;top:0}
.row{position:relative;padding:14px 18px 14px 14px;padding-inline-start:26px;border-bottom:1px solid var(--line);background:var(--rowbg);transition:background .2s,transform .2s var(--ease)}
.row:hover{background:color-mix(in srgb,var(--rowbg) 70%,var(--surface-3))}
.row.sel{background:color-mix(in srgb,var(--cyan) 14%,var(--surface))}
.row:last-child{border-bottom:0}
.row::before{content:"";position:absolute;inset-inline-start:7px;top:0;width:9px;height:var(--drip,40%);background:var(--agec);border-radius:0 0 999px 999px;animation:drip .9s var(--ease) both;animation-delay:calc(var(--i,0) * 35ms + .1s)}
.age-g{--agec:var(--g);--rowbg:color-mix(in srgb,var(--g-bg) 55%,var(--surface))}
.age-y{--agec:var(--y);--rowbg:color-mix(in srgb,var(--y-bg) 65%,var(--surface))}
.age-r{--agec:var(--r);--rowbg:color-mix(in srgb,var(--r-bg) 60%,var(--surface))}
.age-c{--agec:#9AA8B8;--rowbg:var(--surface)}
.c-sel input{width:17px;height:17px;accent-color:#004A87;cursor:pointer}
.c-name strong{display:flex;align-items:center;gap:6px;font-weight:600;font-size:15px}
.c-name .ph{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13.5px;direction:ltr}
.c-name .ph a{text-decoration:none}
.c-name .ph a:hover{color:var(--navy)}
.wa-link{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;background:color-mix(in srgb,var(--wa) 14%,transparent);color:var(--wa);transition:transform .2s var(--spring)}
.wa-link:hover{transform:scale(1.15)}
.wa-link svg{width:14px;height:14px}
.new-badge{font-size:11px;font-weight:600;color:#fff;background:var(--orange);padding:1px 7px;border-radius:99px;animation:pulse 2s infinite}
.rg-chip{display:inline-block;font-size:12.5px;padding:2px 9px;border-radius:99px;background:color-mix(in srgb,#004A87 10%,var(--surface));color:var(--navy);border:1px solid color-mix(in srgb,#004A87 22%,transparent)}
.rg-none{color:var(--orange);background:color-mix(in srgb,var(--orange) 10%,var(--surface));border-color:color-mix(in srgb,var(--orange) 35%,transparent)}
.c-addr,.c-act{font-size:14px}
.c-extra{display:contents}
.xf{font-size:14px;word-break:break-word}
.xf .xl{display:none}
.c-date span{display:block}
.c-date small{color:var(--muted);font-size:12.5px}
.c-notes{font-size:13.5px;white-space:pre-wrap;word-break:break-word}
.c-notes small{display:block;color:var(--muted);font-size:12px;margin-top:3px;white-space:normal}
.c-actions{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.chip{display:inline-block;padding:3px 11px;border-radius:999px;font-size:13px;font-weight:500;border:1px solid transparent;white-space:nowrap}
.st-pending{border-color:var(--chip-pending-bd);color:var(--muted);background:var(--surface)}
.empty{padding:56px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px;font-weight:600}
.empty svg{width:54px;height:54px;color:var(--line);margin-bottom:10px}
.more{text-align:center;padding:14px}
.skel{height:64px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,var(--surface) 0,var(--surface-2) 40%,var(--surface) 80%);background-size:200% 100%;animation:shimmer 1.4s linear infinite}
@media (max-width:1000px){
  .head{display:none}
  .list-in{min-width:0}
  .cols{grid-template-columns:auto 1fr auto;grid-template-areas:"sel name status" "sel date date" "sel extra extra" "sel addr act" "sel notes notes" "sel actions actions";gap:6px 12px}
  .cols.nosel{grid-template-columns:1fr auto;grid-template-areas:"name status" "date date" "extra extra" "addr act" "notes notes" "actions actions"}
  .c-sel{grid-area:sel;align-self:start}.c-name{grid-area:name}.c-status{grid-area:status}.c-date{grid-area:date}.c-addr{grid-area:addr}.c-act{grid-area:act}.c-notes{grid-area:notes}.c-actions{grid-area:actions;justify-content:flex-start;margin-top:4px}
  .c-extra{display:flex;flex-wrap:wrap;gap:2px 16px;grid-area:extra}
  .xf .xl{display:inline;color:var(--muted)}
  .c-date span,.c-date small{display:inline;margin-inline-end:8px}
  .c-act{text-align:end;color:var(--muted)}
  .c-notes:empty{display:none}
  .top-in{flex-wrap:wrap;padding:10px 14px}
  .tabs{order:3;width:100%;margin:0;overflow-x:auto}
  main{padding:14px 14px 100px}
  .toolbar select{flex:1 1 130px}
}

/* ---------- bulk bar ---------- */
.bulk{position:fixed;inset-inline:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;justify-content:center;pointer-events:none}
.bulk-in{pointer-events:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#0F2236;color:#fff;padding:10px 12px 10px 16px;border-radius:16px;box-shadow:var(--shadow-lg);animation:slideUp .45s var(--spring) both;max-width:calc(100vw - 24px)}
.bulk-in b{font-weight:600}
.bulk-in select{background:#1D3150;color:#fff;border:1px solid #2C4668;border-radius:10px;padding:7px 10px}
.bulk-in .btn{border-color:#2C4668;background:#1D3150;color:#fff}

/* ---------- panels & dashboard ---------- */
.panels{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.panels>.panel{grid-column:span 4}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow-sm)}
.panels>.panel.w6{grid-column:span 6}.panels>.panel.w8{grid-column:span 8}.panels>.panel.w12{grid-column:1/-1}
@media (max-width:1100px){.panels>.panel,.panels>.panel.w6,.panels>.panel.w8{grid-column:span 6}}
@media (max-width:760px){.panels>.panel,.panels>.panel.w6,.panels>.panel.w8{grid-column:1/-1}}
.panel h3{margin:0 0 3px;font-size:16px;font-weight:600}
.panel p.hint{margin:0 0 14px;color:var(--muted);font-size:13px}
.bar{display:grid;grid-template-columns:minmax(90px,130px) 1fr 44px;gap:10px;align-items:center;margin:9px 0;font-size:14px}
.bar .track{height:12px;background:var(--surface-3);border-radius:6px;overflow:hidden}
.bar .fill{height:100%;border-radius:6px;transform-origin:right;animation:barIn 1s var(--ease) both;animation-delay:calc(var(--i,0) * 60ms + .1s)}
@keyframes barIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.bar .v{text-align:end;font-weight:600}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:start;font-weight:500;color:var(--muted);font-size:12.5px;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{animation:fadeUp .45s var(--ease) both;animation-delay:calc(var(--i,0) * 40ms)}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl .acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.minibar{height:6px;background:var(--surface-3);border-radius:4px;overflow:hidden;min-width:70px}
.minibar i{display:block;height:100%;border-radius:4px;background:var(--g);transform-origin:right;animation:barIn .9s var(--ease) both}
.table-scroll{overflow-x:auto}
.off{opacity:.5}
.chart svg{width:100%;height:auto;display:block}
.chart .gbar{transform-box:fill-box;transform-origin:bottom;animation:grow .8s var(--ease) both}
.chart .gline{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.4s var(--ease) .3s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.chart .gdot{opacity:0;animation:fadeIn .3s 1.4s forwards}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font)}
.chart .grid{stroke:var(--line)}
.legend-mini{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted);margin-top:8px}
.legend-mini i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut{width:150px;height:150px;flex:none}
.donut circle.seg{transition:stroke-dasharray 1s var(--ease);animation:fadeIn .6s both}
.donut text{font-family:var(--font)}
.dash-filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dash-filters .inp{width:auto}
.seg-btns{display:inline-flex;background:var(--surface-3);padding:3px;border-radius:12px;gap:2px}
.seg-btns button{border:0;background:none;padding:6px 11px;border-radius:9px;cursor:pointer;color:var(--muted);font-size:13px}
.seg-btns button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}

/* ---------- settings ---------- */
.set-wrap{display:grid;grid-template-columns:230px 1fr;gap:18px;align-items:start}
@media (max-width:860px){.set-wrap{grid-template-columns:1fr}}
.set-nav{position:sticky;top:84px;display:flex;flex-direction:column;gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:8px}
@media (max-width:860px){.set-nav{position:static;flex-direction:row;overflow-x:auto}}
.set-nav button{display:flex;align-items:center;gap:9px;border:0;background:none;padding:10px 12px;border-radius:11px;cursor:pointer;color:var(--muted);text-align:start;white-space:nowrap;transition:all .2s}
.set-nav button svg{width:18px;height:18px}
.set-nav button[aria-current="true"]{background:color-mix(in srgb,#004A87 10%,var(--surface));color:var(--navy);font-weight:500}
.set-body{display:grid;gap:14px}
.cols2{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:14px;align-items:start}
@media (max-width:1000px){.cols2{grid-template-columns:1fr}}
.panel form{display:flex;flex-direction:column;gap:12px}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg label{position:relative;flex:1;text-align:center;padding:9px;cursor:pointer;font-size:14px;color:var(--ink);border-inline-start:1px solid var(--line);transition:background .2s}
.seg label:first-child{border-inline-start:0}
.seg input{position:absolute;inset:0;opacity:0;margin:0;pointer-events:none}
.seg label:has(input:checked){background:#004A87;color:#fff}
.seg label:has(input:focus-visible){outline:2px solid var(--focus);outline-offset:-2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{position:relative;cursor:pointer}
.chips input{position:absolute;inset:0;opacity:0;margin:0}
.chips span{display:inline-block;padding:5px 11px;border-radius:99px;border:1px solid var(--line);font-size:13px;transition:all .2s}
.chips input:checked+span{background:#004A87;border-color:#004A87;color:#fff}
.chips input:focus-visible+span{outline:2px solid var(--focus)}
.kw{display:inline-block;font-size:12px;padding:1px 8px;margin:2px;border-radius:99px;background:var(--surface-3);color:var(--muted)}
.prov{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.prov label{position:relative;display:block;border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;transition:all .2s var(--ease)}
.prov label:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.prov input{position:absolute;inset:0;opacity:0;margin:0}
.prov label:has(input:checked){border-color:#004A87;box-shadow:inset 0 0 0 1px #004A87;background:color-mix(in srgb,#004A87 6%,var(--surface))}
.prov b{display:block;font-weight:600;margin-bottom:3px}
.prov small{color:var(--muted);font-size:12.5px}
.steps-mini{margin:6px 0 0;padding-inline-start:20px;font-size:13.5px;color:var(--muted);line-height:1.9}
.status-pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.status-pick label{position:relative;border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;display:flex;align-items:center;gap:10px;font-weight:500;transition:all .2s var(--ease)}
.status-pick label:hover{transform:translateY(-1px)}
.status-pick input{position:absolute;inset:0;opacity:0;margin:0;pointer-events:none}
.status-pick .sw{width:14px;height:14px;border-radius:50%;flex:none}
.status-pick label:has(input:checked){border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--surface-2)}
.status-pick label:has(input:focus-visible){outline:2px solid var(--focus)}
.swatch{display:block;width:26px;height:26px;border-radius:8px;border:2px solid transparent;transition:transform .2s var(--spring)}
label:has(input[name=color]:checked) .swatch{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--surface);transform:scale(1.1)}
.hist{font-size:13px;color:var(--muted);margin:0;padding:0;list-style:none;border-top:1px solid var(--line);padding-top:10px}
.hist li{padding:3px 0}

/* ---------- modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(8,20,35,.5);backdrop-filter:blur(3px);z-index:50;display:grid;place-items:center;padding:16px;animation:fadeIn .2s both}
.modal{background:var(--surface);border-radius:20px;width:100%;max-width:540px;max-height:calc(100vh - 32px);overflow:auto;border:1px solid var(--line);box-shadow:var(--shadow-lg);animation:pop .4s var(--spring) both}
.modal.wide{max-width:860px}
.modal header{padding:20px 24px 6px}
.modal header h2{margin:0;font-size:19px;font-weight:600}
.modal header p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.modal .body{padding:12px 24px;display:flex;flex-direction:column;gap:14px}
.modal footer{padding:12px 24px 22px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.two{grid-template-columns:1fr}}
.wizard-steps{display:flex;gap:6px;margin-top:12px}
.wizard-steps span{flex:1;height:4px;border-radius:4px;background:var(--line);transition:background .4s}
.wizard-steps span.on{background:linear-gradient(90deg,var(--cyan),#004A87)}
.drop{border:2px dashed var(--line);border-radius:16px;padding:34px 20px;text-align:center;color:var(--muted);cursor:pointer;transition:all .25s var(--ease)}
.drop svg{width:44px;height:44px;color:var(--cyan);margin-bottom:6px}
.drop:hover,.drop.over{border-color:var(--cyan);color:var(--ink);background:color-mix(in srgb,var(--cyan) 6%,transparent);transform:scale(1.01)}
.map-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.map-col{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--surface-2);animation:fadeUp .4s var(--ease) both;animation-delay:calc(var(--i,0) * 30ms)}
.map-col.auto{border-color:color-mix(in srgb,var(--g) 50%,transparent)}
.map-col b{display:block;font-size:13.5px;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.map-col .samp{font-size:12.5px;color:var(--muted);margin-bottom:8px;min-height:2.6em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.map-col select{width:100%;border:1px solid var(--line);border-radius:10px;padding:7px 8px;background:var(--surface)}
.imp-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:560px){.imp-stats{grid-template-columns:1fr 1fr}}
.imp-stats div{background:var(--surface-2);border-radius:12px;padding:12px;text-align:center;animation:pop .4s var(--spring) both;animation-delay:calc(var(--i,0) * 70ms)}
.imp-stats b{display:block;font-size:24px}
.imp-stats span{font-size:12.5px;color:var(--muted)}
.imp-errs{font-size:13px;color:var(--muted);max-height:140px;overflow:auto;margin:0;padding-inline-start:18px}
.progress{height:10px;background:var(--surface-3);border-radius:6px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),#004A87);transition:width .3s var(--ease)}
.wa-list{display:flex;flex-direction:column;gap:8px}
.wa-item{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;animation:fadeUp .4s var(--ease) both;animation-delay:calc(var(--i,0) * 60ms)}
.wa-item.done{opacity:.55}
.wa-item b{font-weight:500}
.wa-item .btn{margin-inline-start:auto}

/* ---------- toast ---------- */
.toasts{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{display:flex;gap:8px;align-items:center;background:#0F2236;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;box-shadow:var(--shadow-lg);max-width:90vw;animation:pop .35s var(--spring) both}
.toast.err{background:#B32D2D}
.toast.out{animation:fadeIn .25s reverse both}

/* ---------- report (pdf) ---------- */
#report{position:absolute;left:-30000px;top:0;direction:rtl;font-family:var(--font)}
.rp{width:1123px;height:794px;background:#fff;color:#10233A;padding:36px 44px;position:relative;overflow:hidden}
.rp-head{display:flex;align-items:center;gap:18px;border-bottom:2px solid #004A87;padding-bottom:12px;margin-bottom:18px}
.rp-head img{width:150px}
.rp-head h1{font-size:23px;margin:0;font-weight:600;color:#004A87}
.rp-head p{margin:2px 0 0;color:#5A6B7E;font-size:13px}
.rp-head .pg{margin-inline-start:auto;color:#5A6B7E;font-size:13px}
.rp-kpis{display:grid;gap:10px;margin-bottom:18px}
.rp-kpis div{background:#F2F5F9;border-radius:10px;padding:11px 13px}
.rp-kpis b{display:block;font-size:25px;color:#004A87;font-weight:600}
.rp-kpis span{font-size:12.5px;color:#5A6B7E}
.rp-cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:22px}
.rp h3{font-size:15px;margin:0 0 8px;font-weight:600}
.rp .bar{grid-template-columns:110px 1fr 38px}
.rp .bar .fill{animation:none}
.rp .bar .track{background:#EEF2F7}
.rp table{width:100%;border-collapse:collapse;font-size:12.5px}
.rp th{background:#004A87;color:#fff;font-weight:500;padding:7px 8px;text-align:right}
.rp td{padding:6px 8px;border-bottom:1px solid #E3E8EF;vertical-align:top}
.rp tr.g td{background:#EAF7EF}.rp tr.y td{background:#FFF7DB}.rp tr.r td{background:#FDECEC}
.rp td.ag{width:8px;padding:0}.rp tr.g td.ag{background:#2E9E5B}.rp tr.y td.ag{background:#D9A300}.rp tr.r td.ag{background:#D23C3C}
.rp .ltr{direction:ltr;unicode-bidi:embed;text-align:right}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style>

    for (var i = Math.max(0, n - 2); i <= Math.min(t.length - 1, n); i++) extra += " | " + (i + 1) + ": " + t[i].slice(0, 160);
  } catch (x) {}
  window.__bootErr(e.message + extra, e.lineno);
});

    if(S.seenBefore === null){ const k = "mcrm-seen-" + S.me.u; S.seenBefore = lsGet(k) || ""; lsSet(k, nowStr()); }

  }catch(e){ if(e.code !== "auth" && !quiet) toast(errMsg(e), "err"); return false; }

/* ---------- data views ---------- */
function allRows(){
  const out = S.clients.map(c => {
    const rd = toYMD(c.requestDate) || "";
    const days = daysSince(rd);
    const hist = Array.isArray(c.history) ? c.history : [];
    const codedAt = (hist.find(h => h.s === "coded") || {}).at || "";
    return {...c, extra: c.extra || {}, requestDate:rd, status: STATUS[c.status] ? c.status : "pending", region: REGION[c.region] ? c.region : "",
      notes:c.notes || "", by:c.byName || "", at:c.at || "", history: hist, days, age: ageOf(days), codedAt: codedAt.slice(0,10),
      isNew: !!(S.seenBefore && c.createdAt && c.createdAt > S.seenBefore && c.createdBy !== (S.me && S.me.u))};
  });
  out.sort((a,b) => (a.requestDate||"").localeCompare(b.requestDate||"") || (a.createdAt||"").localeCompare(b.createdAt||""));
  return out;
}
function applyFilters(all, ignoreAge){
  const f = S.f, q = norm(f.q);
  return all.filter(r =>
    (f.status === "all" || r.status === f.status) &&
    (ignoreAge || f.age === "all" || (r.age === f.age && !isClosed(r.status))) &&
    (f.act === "all" || r.activity === f.act) &&
    (f.region === "all" || (f.region === "none" ? !r.region : r.region === f.region)) &&
    Object.entries(f.x).every(([k,v]) => !v || (r.extra[k] || "") === v) &&
    (!q || norm(r.name).includes(q) || String(r.phone||"").includes(q) || norm(r.address).includes(q) || norm(r.activityOther).includes(q)
        || norm(regionName(r.region)).includes(q) || Object.values(r.extra).some(v => norm(v).includes(q))));
}
const filtersActive = () => S.f.q.trim() || S.f.status !== "all" || S.f.age !== "all" || S.f.act !== "all" || S.f.region !== "all" || Object.values(S.f.x).some(Boolean);
function filterDesc(){
  const p = [];
  if(S.f.status !== "all") p.push("الحالة: " + STATUS[S.f.status].label);
  if(S.f.region !== "all") p.push("المنطقة: " + (S.f.region === "none" ? "بدون منطقة" : regionName(S.f.region)));
  if(S.f.age !== "all") p.push("المدة: " + AGE[S.f.age].label);
  if(S.f.act !== "all") p.push("النشاط: " + S.f.act);
  S.fields.forEach(fl => { if(S.f.x[fl.key]) p.push(fl.label + ": " + S.f.x[fl.key]); });
  if(S.f.q.trim()) p.push("بحث: " + S.f.q.trim());
  return p.join("، ");
}
function summarize(all, range){
  const s = {total: all.length, st:Object.fromEntries(STATUS_KEYS.map(k => [k,0])), ageOpen:{g:0,y:0,r:0}, act:{}, rep:{}, oldest:[], overdue:0, codeDays:[], open:0};
  ACTS.forEach(a => s.act[a] = 0);
  for(const r of all){
    s.st[r.status]++;
    if(!isClosed(r.status)){ s.open++; s.ageOpen[r.age]++; s.oldest.push(r); if(r.days > 30) s.overdue++; }
    s.act[ACTS.includes(r.activity) ? r.activity : "أخرى"]++;
    if(r.by) s.rep[r.by] = (s.rep[r.by] || 0) + 1;
    if(r.status === "coded" && r.codedAt && r.requestDate){ const d = daysBetween(r.requestDate, r.codedAt); if(d >= 0) s.codeDays.push(d); }
  }
  s.coded = s.st.coded || 0;
  s.pct = s.total ? Math.round(s.coded * 100 / s.total) : 0;
  s.avgCode = s.codeDays.length ? (s.codeDays.reduce((a,b) => a + b, 0) / s.codeDays.length) : null;
  s.kpis = [[s.total, "إجمالي العملاء"], ...STATUS_KEYS.map(k => [s.st[k], STATUS[k].label]), [s.pct + "%", "نسبة التكويد"]];
  return s;
}
function regionStats(rows){
  const keys = [...S.regions.map(r => r.key), ""];
  return keys.map(k => {
    const rs = rows.filter(r => r.region === k);
    const open = rs.filter(r => !isClosed(r.status));
    const coded = rs.filter(r => r.status === "coded").length;
    return {key:k, name: k ? regionName(k) : "بدون منطقة", total: rs.length, open: open.length, coded, pct: rs.length ? Math.round(coded * 100 / rs.length) : 0,
      wait: open.length ? Math.round(open.reduce((a, r) => a + r.days, 0) / open.length) : 0, overdue: open.filter(r => r.days > 30).length,
      team: S.users.filter(u => u.role !== "admin" && (u.regions || []).includes(k)).map(u => u.name)};
  }).filter(x => x.key || x.total);
}

function dashRows(){
  const d = S.dash; let rows = allRows();
  if(d.region !== "all") rows = rows.filter(r => d.region === "none" ? !r.region : r.region === d.region);
  const [from, to] = dashRange();
  if(from) rows = rows.filter(r => r.requestDate >= from);
  if(to) rows = rows.filter(r => r.requestDate <= to);
  return rows;
}
function dashRange(){
  const d = S.dash, t = new Date();
  if(d.range === "30") { const f = new Date(t); f.setDate(f.getDate() - 30); return [ymd(f), ""]; }
  if(d.range === "90") { const f = new Date(t); f.setDate(f.getDate() - 90); return [ymd(f), ""]; }
  if(d.range === "year") return [t.getFullYear() + "-01-01", ""];
  if(d.range === "custom") return [d.from, d.to];
  return ["", ""];
}

function barsHTML(items, max){
  max = Math.max(1, max);
  return items.map(([label, val, color], i) => `<div class="bar"><span>${esc(label)}</span><div class="track"><div class="fill" style="width:${(val/max*100).toFixed(1)}%;background:${color};--i:${i}"></div></div><span class="v num">${val}</span></div>`).join("");
}
function weekStart(d){ const x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate() - ((x.getDay() + 1) % 7)); return x; }
function trendSVG(rows){
  const W = 640, H = 230, P = {l:34, r:12, t:14, b:30}, N = 12;
  const start = weekStart(new Date()); start.setDate(start.getDate() - 7 * (N - 1));
  const weeks = Array.from({length:N}, (_, i) => { const d = new Date(start); d.setDate(d.getDate() + 7 * i); return {d, k:ymd(d), n:0, c:0}; });
  const idx = s => { if(!s) return -1; const i = Math.floor((parseYMD(s) - start) / (7 * 864e5)); return i >= 0 && i < N ? i : -1; };
  rows.forEach(r => { const a = idx(r.requestDate); if(a >= 0) weeks[a].n++; const b = idx(r.codedAt); if(b >= 0 && r.status === "coded") weeks[b].c++; });
  const max = Math.max(4, ...weeks.map(w => Math.max(w.n, w.c)));
  const cw = (W - P.l - P.r) / N, y = v => H - P.b - (v / max) * (H - P.t - P.b);
  const grid = [0, .25, .5, .75, 1].map(p => { const v = Math.round(max * p), yy = y(v); return `<line class="grid" x1="${P.l}" x2="${W - P.r}" y1="${yy}" y2="${yy}"/><text x="${P.l - 6}" y="${yy + 4}" text-anchor="end">${v}</text>`; }).join("");
  const bars = weeks.map((w, i) => { const x = P.l + i * cw + cw * .2, h = H - P.b - y(w.n); return `<rect class="gbar" x="${x}" y="${y(w.n)}" width="${cw * .6}" height="${Math.max(0, h)}" rx="4" fill="#39C0E0" style="animation-delay:${i * 45}ms"><title>${fmtDate(w.k)}: ${w.n} طلب جديد</title></rect>`; }).join("");
  const pts = weeks.map((w, i) => [P.l + i * cw + cw / 2, y(w.c)]);
  let len = 0; for(let i = 1; i < pts.length; i++) len += Math.hypot(pts[i][0] - pts[i-1][0], pts[i][1] - pts[i-1][1]);
  const line = `<polyline class="gline" style="--len:${Math.ceil(len)}" points="${pts.map(p => p.map(n => n.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="#ED7423" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  const dots = pts.map((p, i) => `<circle class="gdot" cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#ED7423"><title>${fmtDate(weeks[i].k)}: ${weeks[i].c} اتكودوا</title></circle>`).join("");
  const labels = weeks.map((w, i) => i % 2 ? "" : `<text x="${P.l + i * cw + cw / 2}" y="${H - 10}" text-anchor="middle">${w.d.getDate()}/${w.d.getMonth() + 1}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="الطلبات الجديدة والتكويد آخر 12 أسبوع">${grid}${bars}${line}${dots}${labels}</svg>`;
}
function donutSVG(s){
  const keys = STATUS_KEYS.filter(k => s.st[k] > 0), total = s.total || 1, R = 54, C = 2 * Math.PI * R;
  let off = 0;
  const segs = keys.map((k, i) => { const len = s.st[k] / total * C; const el = `<circle class="seg" r="${R}" cx="75" cy="75" fill="none" stroke="${STATUS[k].color}" stroke-width="20" stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 75 75)" style="animation-delay:${i * 80}ms"><title>${esc(STATUS[k].label)}: ${s.st[k]}</title></circle>`; off += len; return el; }).join("");
  return `<svg class="donut" viewBox="0 0 150 150" role="img" aria-label="العملاء حسب الحالة"><circle r="${R}" cx="75" cy="75" fill="none" stroke="var(--surface-3)" stroke-width="20"/>${segs}
    <text x="75" y="72" text-anchor="middle" font-size="24" font-weight="600" fill="var(--ink)">${s.pct}%</text><text x="75" y="92" text-anchor="middle" font-size="11" fill="var(--muted)">اتكودوا</text></svg>`;
}
function teamStats(rows){
  const [from, to] = dashRange();
  const inR = at => { const d = String(at).slice(0,10); return (!from || d >= from) && (!to || d <= to); };
  const ids = new Set(rows.map(r => r.id));
  return S.users.filter(u => u.active !== false).map(u => {
    let upd = 0, coded = 0, last = "";
    S.clients.forEach(c => { if(!ids.has(c.id)) return; (c.history || []).forEach(h => { if(h.by === u.name && inR(h.at)){ upd++; if(h.s === "coded") coded++; if(h.at > last) last = h.at; } }); });
    const open = rows.filter(r => !isClosed(r.status) && (u.role === "admin" || !(u.regions || []).length || u.regions.includes(r.region))).length;
    return {u, upd, coded, last, open};
  }).sort((a,b) => b.coded - a.coded || b.upd - a.upd);
}

function analyze(){
  const aoa = IMP.sheets[IMP.sheetIdx].aoa;
  let hi = -1, best = 1;
  for(let i = 0; i < Math.min(15, aoa.length); i++){
    let score = 0;
    aoa[i].forEach(h => { const t = String(h).trim(); if(!t || t.length > 40) return; if(S.fields.some(f => f.label === t) || HEAD_PAT.some(([,re]) => re.test(t))) score++; if(normPhone(t).length >= 10 || toYMD(h)) score -= 2; });
    if(score > best){ best = score; hi = i; }
  }
  IMP.hi = hi;
  const width = Math.max(...aoa.slice(0, 200).map(r => r.length));
  const data = aoa.slice(hi + 1);
  const samp = data.slice(0, 60);
  IMP.cols = Array.from({length: width}, (_, c) => {
    const head = hi >= 0 ? String(aoa[hi][c] ?? "").trim() : "";
    const vals = samp.map(r => r[c]).filter(v => String(v ?? "").trim() !== "");
    return {head: head || `عمود ${c + 1}`, vals, samples: vals.slice(0, 3).map(v => v instanceof Date ? ymd(v) : String(v)), target:"", auto:false, fill: vals.length / Math.max(1, samp.length)};
  });
  const used = new Set();
  const set = (c, t) => { c.target = t; c.auto = true; used.add(t); };
  IMP.cols.forEach(c => { if(!c.head || c.head.startsWith("عمود ")) return; const fl = S.fields.find(f => f.label === c.head); if(fl && !used.has("x:" + fl.key)){ set(c, "x:" + fl.key); return; }
    for(const [t, re] of HEAD_PAT){ if(t === "region" && !S.regions.length) continue; if(!used.has(t) && re.test(c.head)){ set(c, t); break; } } });
  const ratio = (c, fn) => c.vals.length ? c.vals.filter(fn).length / c.vals.length : 0;
  const free = () => IMP.cols.filter(c => !c.target && c.fill > .2);
  const sniff = (t, fn, min) => { if(used.has(t)) return; const cands = free().map(c => [c, ratio(c, fn)]).filter(x => x[1] >= min).sort((a,b) => b[1] - a[1]); if(cands.length) set(cands[0][0], t); };
  sniff("phone", v => /^0?1[0125]\d{8}$/.test(normPhone(String(v).split(/[\/,،|\n]/)[0])), .5);
  sniff("date", v => !!toYMD(v), .6);
  sniff("act", v => /ورش|محل|مقاول|معرض|مصنع/.test(String(v)), .4);
  if(S.regions.length) sniff("region", v => !!(regionByName(v) || (String(v).length < 30 && matchRegion(v))), .5);
  sniff("status", v => !!mapStatus(v), .5);
  const textCols = free().filter(c => ratio(c, v => /[؀-ۿA-Za-z]/.test(String(v)) && !/^\d+$/.test(latin(v))) > .7)
    .map(c => [c, c.vals.reduce((a, v) => a + String(v).length, 0) / Math.max(1, c.vals.length)]);
  if(!used.has("name")){ const n = textCols.filter(x => x[1] <= 40 && !x[0].target).sort((a,b) => a[1] - b[1])[0]; if(n) set(n[0], "name"); }
  if(!used.has("address")){ const a = textCols.filter(x => !x[0].target).sort((a,b) => b[1] - a[1])[0]; if(a && a[1] > 8) set(a[0], "address"); }
  IMP.opts = IMP.opts || {mode:"merge", today:true, autoRegion:true, notify: S.settings.notifyOnAdd !== false};
}

function mapStatus(v){
  const s = String(v ?? "").trim(); if(!s) return null;
  const exact = STATUS_KEYS.find(k => STATUS[k].label === s); if(exact) return exact;
  if(/مكالم|اتصال|call/i.test(s) && STATUS.call) return "call";
  if(/مرفوض|رفض|reject/i.test(s)) return "rejected";
  if(/زيار|visit/i.test(s)) return "visit";
  if(/لسه|لم|انتظار|pending/i.test(s)) return "pending";
  if(/اتكود|تكويد|مكود|تم|coded|done/i.test(s)) return "coded";
  return null;
}
function mapAct(v){
  const s = String(v ?? "").trim();
  if(!s) return ["أخرى",""];
  if(/ورش/.test(s)) return ["ورشة",""];
  if(/محل/.test(s)) return ["محل",""];
  if(/^(أخرى|اخرى|آخر|اخر|other)$/i.test(s)) return ["أخرى",""];
  return ["أخرى", s];
}
function parsePhones(v){
  const s = latin(v instanceof Date ? "" : v);
  const out = [];
  (s.match(/\+?\d[\d\s\-]{6,17}\d/g) || []).forEach(m => { const p = normPhone(m.replace(/[\s\-]/g, "")); if(p.length >= 7 && !out.includes(p)) out.push(p); });
  if(!out.length){ const p = normPhone(s); if(p.length >= 7) out.push(p); }
  return out;
}
function parseImport(){
  const aoa = IMP.sheets[IMP.sheetIdx].aoa, data = aoa.slice(IMP.hi + 1), o = IMP.opts;
  const colOf = t => IMP.cols.findIndex(c => c.target === t);
  const ci = {}; ["name","phone","address","act","date","region","status","notes"].forEach(t => ci[t] = colOf(t));
  const xcols = S.fields.map(f => [f, colOf("x:" + f.key)]).filter(x => x[1] >= 0);
  const existing = new Set(S.clients.map(c => String(c.phone)));
  const seen = new Map(); const ok = []; const errs = []; let dupFile = 0, dupOld = 0, fixedDate = 0, autoRg = 0; const unknownRg = new Map();
  const headRow = IMP.hi >= 0 ? aoa[IMP.hi].map(v => String(v).trim()).join("|") : null;
  const today = todayStr();
  data.forEach((row, i) => {
    const line = IMP.hi + 2 + i;
    if(headRow && row.map(v => String(v).trim()).join("|") === headRow) return;
    const get = k => ci[k] >= 0 ? row[ci[k]] : "";
    const name = String(get("name") ?? "").replace(/\s+/g, " ").trim();
    const phones = parsePhones(get("phone"));
    if(!name && !phones.length) return;
    if(!name){ errs.push(`صف ${line}: الاسم ناقص (${phones[0] || ""})`); return; }
    if(!phones.length){ errs.push(`صف ${line}: الموبايل ناقص أو مش صحيح (${name})`); return; }
    const phone = phones[0];
    let date = toYMD(get("date"));
    if(date && date > today){ date = today; fixedDate++; }
    if(!date){ if(o.today){ date = today; fixedDate++; } else { errs.push(`صف ${line}: تاريخ طلب التكويد ناقص أو مش مفهوم (${name})`); return; } }
    if(seen.has(phone)){ dupFile++; return; }
    const address = String(get("address") ?? "").replace(/\s+/g, " ").trim();
    let region = "";
    const rv = String(get("region") ?? "").trim();
    if(rv){ region = regionByName(rv) || matchRegion(rv); if(!region) unknownRg.set(rv, (unknownRg.get(rv) || 0) + 1); }
    if(!region && o.autoRegion){ region = matchRegion(address); if(region) autoRg++; }
    const [activity, activityOther] = mapAct(get("act"));
    let notes = String(get("notes") ?? "").trim();
    if(phones.length > 1) notes = (notes ? notes + " | " : "") + "أرقام تانية: " + phones.slice(1).join(" - ");
    const extra = {};
    xcols.forEach(([fl, c]) => { let v = row[c]; v = fl.type === "date" ? (toYMD(v) || "") : (v instanceof Date ? ymd(v) : latin(v).trim()); if(fl.type === "select" && v && !fl.options.includes(v)) v = ""; extra[fl.key] = v; });
    const rec = {name, phone, address, activity, activityOther, requestDate:date, status: mapStatus(get("status")) || "", notes, extra};
    if(S.regions.length) rec.region = region;
    if(existing.has(phone)) dupOld++;
    seen.set(phone, 1); ok.push(rec);
  });
  return {ok, errs, dupFile, dupOld, fixedDate, autoRg, unknownRg};
}

function pptBars(p, sl, T, heading, items, x, y, w){
  sl.addText(heading, {...T, x, y, w, h:0.5, fontSize:17, bold:true, color:"10233A"});
  const max = Math.max(1, ...items.map(i => i[1]));
  const labelW = 2.0, valW = 0.7, trackW = w - labelW - valW - 0.2;
  items.forEach(([label, val, color], i) => {
    const yy = y + 0.75 + i * 0.68;
    sl.addText(label, {...T, x:x + w - labelW, y:yy, w:labelW, h:0.45, fontSize:14, color:"10233A", valign:"middle"});
    sl.addShape(p.ShapeType.rect, {x:x + valW + 0.1, y:yy + 0.08, w:trackW, h:0.3, fill:{color:"EEF2F7"}, line:{color:"EEF2F7"}});
    const bw = Math.max(0.02, trackW * val / max);
    sl.addShape(p.ShapeType.rect, {x:x + valW + 0.1 + trackW - bw, y:yy + 0.08, w:bw, h:0.3, fill:{color}, line:{color}});
    sl.addText(String(val), {...T, align:"left", x, y:yy, w:valW, h:0.45, fontSize:15, bold:true, color:"10233A", valign:"middle"});
  });
}

function readStatusForm(form, idx){
  const fd = new FormData(form);
  const label = String(fd.get("label") || "").trim();
  if(!label) return {err:"اكتب اسم الحالة."};
  if(STATUS_KEYS.some((k,i) => STATUS[k].label === label && i !== idx)) return {err:"فيه حالة بنفس الاسم."};
  const color = String(form.dataset.custom === "1" ? fd.get("colorc") : (fd.get("color") || fd.get("colorc")) || "#5E6B79");
  return {st:{label, color, closed: !!fd.get("closed")}};
}
function readFieldForm(form, idx){
  const fd = new FormData(form);
  const label = String(fd.get("label") || "").trim(), type = String(fd.get("type") || "text");
  const options = String(fd.get("options") || "").split("\n").map(x => x.trim()).filter(Boolean);
  if(!label) return {err:"اكتب اسم الخانة."};
  if(RESERVED.includes(label)) return {err:"الاسم ده مستخدم في الأعمدة الأساسية، اختار اسم تاني."};
  if(S.fields.some((f,i) => f.label === label && i !== idx)) return {err:"فيه خانة بنفس الاسم."};
  if(type === "select" && !options.length) return {err:"اكتب اختيار واحد على الأقل."};
  return {field:{label, type, options: type === "select" ? [...new Set(options)] : [], hidden: !!fd.get("hidden")}};
}
function readRegionForm(form, idx){

  return {rg:{name, keywords: String(fd.get("keywords") || "").split(/[,،\n]/).map(x => x.trim()).filter(Boolean)}};
}

  }
  if(kind === "status-def" || kind === "status-edit"){
    const idx = kind === "status-edit" ? +form.dataset.i : -1;
    const res = readStatusForm(form, idx), err = $(kind === "status-def" ? "#sErr" : "#seErr");
    if(res.err){ err.textContent = res.err; return; }
    const list = stList();
    if(idx >= 0) list[idx] = {...list[idx], ...res.st}; else list.push(res.st);
    const r = await mutate(btn, "saveStatuses", {statuses:list}, idx >= 0 ? "اتحفظت الحالة" : "اتضافت الحالة");
    if(r){ if(idx >= 0) closeModal(); else renderSetBody(true); }
    return;
  }
  if(kind === "field" || kind === "fieldedit"){
    const idx = kind === "fieldedit" ? +form.dataset.i : -1;
    const res = readFieldForm(form, idx), err = $(kind === "field" ? "#fErr" : "#feErr");
    if(res.err){ err.textContent = res.err; return; }
    const list = S.fields.slice();
    if(idx >= 0){ const old = list[idx];
      if(old.type === "select" && res.field.type === "select"){ const gone = old.options.filter(o => !res.field.options.includes(o)); if(gone.length && form.dataset.ok !== "1"){ err.textContent = `الاختيارات دي هتتشال: ${gone.join("، ")}. دوس حفظ تاني للتأكيد.`; form.dataset.ok = "1"; return; } }
      list[idx] = {...res.field, key: old.key}; }
    else list.push(res.field);
    const r = await mutate(btn, "saveFields", {fields:list}, idx >= 0 ? "اتحفظت الخانة" : "اتضافت الخانة");
    if(r){ if(idx >= 0) closeModal(); else renderSetBody(true); }
    return;
  }
  if(kind === "wa"){
    const p = g("provider");
    const settings = {scope: fd.get("scopeOwn") ? "own" : "all", notifyOnAdd: !!fd.get("notifyOnAdd"), appUrl: g("appUrl"),
      digest:{enabled: !!fd.get("digest"), hour: +g("hour")},
      wa:{provider:p, green:{apiUrl:g("g_apiUrl"), idInstance:g("g_id"), token:g("g_token")}, meta:{phoneId:g("m_phoneId"), template:g("m_template"), lang:g("m_lang") || "ar", version:g("m_version") || "v24.0", token:g("m_token")}}};
    if(settings.digest.enabled && p === "manual"){ $("#waErr").textContent = "الملخص اليومي محتاج إرسال تلقائي (Green-API أو Cloud API)."; return; }
    const r = await mutate(btn, "saveSettings", {settings}, "اتحفظت الإعدادات");
    if(r) renderSetBody(true);
    return;
  }
  if(kind === "watest"){
    const phone = g("phone");
    if(waNum(phone).length < 11){ toast("الرقم مش صحيح", "err"); return; }
    if((S.settings.provider || "manual") === "manual"){ window.open(waLink(phone, "رسالة تجربة من نظام عملاء التطبيق - المهندس ✅"), "_blank", "noopener"); return; }
    lock(true);
    try{ const r = await api("testWhatsApp", {phone}); if(r.result.ok) toast("الرسالة اتبعتت ✓"); else toast("ماتبعتتش: " + r.result.error, "err"); load(true); }
    catch(x){ toast(errMsg(x), "err"); }
    lock(false); return;
  }
});

/* ---------- boot ---------- */
async function boot(){
  S.mode = detectMode();
  if(S.mode === "none"){ renderApp(); return; }
  S.token = tokGet();
  if(S.token){ S.screen = "loading"; renderApp(); if(await load(true)) return; S.screen = null; }
  try{ const r = await call({action:"status"}); if(!r || !r.ok) throw 0; S.needsSetup = !!r.needsSetup; S.connErr = false; }
  catch(e){ S.connErr = true; }
  S.statusReady = true; renderApp();
}
setInterval(() => { if(S.screen === "main" && document.visibilityState === "visible" && !$("#modal").innerHTML && !(document.activeElement && document.activeElement.matches("input,textarea,select"))) load(true); }, 60000);
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible" && S.screen === "main" && S.lastLoad && Date.now() - S.lastLoad > 30000) load(true); });
boot();

</script>
<script>
(function(){
  if("serviceWorker" in navigator) window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
  var deferred = null, btn = null;
  function show(){
    if(btn || window.matchMedia("(display-mode: standalone)").matches) return;
    btn = document.createElement("button");
    btn.className = "btn primary"; btn.textContent = "📲 نزّل التطبيق على الموبايل";
    btn.style.cssText = "position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));inset-inline-start:16px;z-index:45;border-radius:99px;padding:11px 18px;animation:pop .5s var(--spring) both";
    btn.onclick = function(){ if(!deferred) return; deferred.prompt(); deferred.userChoice.finally(function(){ deferred = null; btn.remove(); btn = null; }); };
    document.body.appendChild(btn);
  }
  window.addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); deferred = e; show(); });
  window.addEventListener("appinstalled", function(){ if(btn){ btn.remove(); btn = null; } });
})();
</script>
